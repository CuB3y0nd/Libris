# Optional local E2E stack. MinIO is a test double only, not a production dependency.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: zotero-s3-webdav-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - zotero_webdav

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: zotero-s3-webdav-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-change-me
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
    networks:
      - zotero_webdav

  provisioner:
    depends_on:
      sftpgo:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
